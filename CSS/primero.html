<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba CSS</title>
  
  <style>
    p{
        font-size: 2em;
    }
        .parrafo-verde{
            color:rgb(12, 211, 12);
            font-family:Arial, Helvetica, sans-serif ;
            font-weight: bold;
        }
        .parrafo-amarillo{
            color:yellow;
            font-family:'Courier New', Courier, monospace;
        }
        .parrafo-azul{
            color:blue;
            
        }
         
    </style>
</head>
<body>
    <h1 class="parrafo-azul">Empezando con CSS</h1>
    <p class="parrafo-verde">Este va de color verde</p>
    <p class="parrafo-amarillo">Este va de color amarillo</p>
    <p class="parrafo-azul">Este va de color azul</p>
    
    <div style="border:2px dotted red; padding:50px; margin:50px";>Primer bloque</div>
    <div style="border: 5px dashed green; padding-top: 100px;margin-top: 50px";>Segundo bloque</div>
</body>
</html>
