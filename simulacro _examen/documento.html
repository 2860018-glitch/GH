

    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extraordinaria</title>
    <style>
        body {
            background-image: url('texturapapel.png');
        }

       
        p {
            font-size: 16px;
        }

        div {
            border: 2px solid blue;
            padding: 10px;
            margin: 10px 0;
        }

        h1 {
            color: blue;
        }

        h2 {
            color: green;
        }
    </style>
</head>
<body>

    <h1>Este es mi examen</h1>

    <p><a href="https://www.vedoque.com" target="_blank">Esta es una buena página</a></p>

    <figure>
        <img src="paisaje.png" alt="Paisaje" height="100">
        <figcaption>Esta es una gran imagen.</figcaption>
    </figure>

    <h2 style="background-color: white;">El examen está siendo fácil</h2>

    <p>No esperaba que fuera tan fácil</p>

    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Nota</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Carlos</td>
                <td>8.5</td>
            </tr>
            <tr>
                <td>Laura</td>
                <td>9.0</td>
            </tr>
            <tr>
                <td>Javier</td>
                <td>7.5</td>
            </tr>
        </tbody>
    </table>

    <div>
        <form action="#" method="post">
            <!-- Input para el nombre -->
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
            <br><br>

            <label for="ciclo">Ciclo:</label>
            <select id="ciclo" name="ciclo">
                <option value="ASIR">ASIR</option>
                <option value="DAM">DAM</option>
                <option value="DAW">DAW</option>
            </select>
            <br><br>

            <span>Curso:</span>
            <input type="radio" id="primero" name="curso" value="primero">
            <label for="primero">Primero</label>
            <input type="radio" id="segundo" name="curso" value="segundo">
            <label for="segundo">Segundo</label>
            <br><br>

            <span>Estudios previos:</span>
            <input type="checkbox" id="bachillerato" name="estudios[]" value="Bachillerato">
            <label for="bachillerato">Bachillerato</label>
            <input type="checkbox" id="smr" name="estudios[]" value="SMR">
            <label for="smr">SMR</label>
            <br><br>

            <input type="submit" value="Enviar">
        </form>
    </div>

    <footer>
        <p>Hoy sí que voy a aprobar.</p>
    </footer>

</body>
</html>
