<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis primeras tablas</title>
   
 
</head>
<body>
    <h1>Mis primeras tablas</h1>
    

 <table border="1" bordercolor="red">
        <tr>
            <th>Posición</th>
            <th>Nombre</th>
            <th>Edad</th>
        </tr>
        <tr>
            <td rowspan="2">1º</td>
            <td>Laura gómez</td>
            <td>9,2</td>
        </tr>
        <tr>
            <td>Iván Martínez</td>
            <td>9,2</td>
        </tr>
 </table>

 <table border="1" bordercolor="red">
       <h1>Segunda Tabla</h1>
        <tr>
            <th>1</th>
            <td colspan="2">2</td>
        </tr>

        <tr>
            <th>3</th>
            <th>4</th>
            <th>5</th>
        </tr>
        <tr>
            
            <td rowspan="2">6</td>   
            <td>7</td> 
            <td>8</td>
        </tr>
        <tr>
            <td>9</td> 
            <td>10</td>
        </tr>  
 </table>
     <h2>Tercera tabla con rowspan y colspan</h2>
    <table border="1" bordercolor="red">
        <tr>
            <td>1</td>
            <td colspan="2">2</td>
        </tr>
        <tr>
            <td>3</td>
            <td>4</td>
            <td>5</td>
        </tr>
        <tr>
            <td rowspan="2">6</td>
            <td>7</td>
            <td>8</td>
        </tr>
        <tr>
            <td>9</td>
            <td>10</td>
        </tr>
    </table>

    <h2>Anidar tablas</h2>
    <table border="1" bordercolor="red">
        <tr>
            <td>1</td>
            <td>
                <table border="1" bordercolor="red">
                    <tr>
                        <td>1</td>
                        <td>2</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>4</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td>2</td>
            <td>3</td>
        </tr>
    </table>
</body>
</html>
